events {
    worker_connections 1024;
}

http {
    # ----------------------------------------------------
    # Security Headers (Phase 8)
    # ----------------------------------------------------
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" always;

    # Redirect HTTP to HTTPS
    server {
        listen 8000;
        server_name localhost;
        return 301 https://$host:8443$request_uri;
    }

    # HTTPS Server
    server {
        listen 8443 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/ssl/gateway.crt;
        ssl_certificate_key /etc/nginx/ssl/gateway.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location /health {
            return 200 '{"status": "healthy", "service": "API Gateway"}';
            add_header Content-Type application/json;
        }

        location /auth/ {
            proxy_pass http://auth_service:8000/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /employee/ {
            proxy_pass http://employee_service:8000/employee/;
            proxy_set_header Host $host;
        }

        location /hr/ {
            proxy_pass http://hr_service:8000/hr/;
            proxy_set_header Host $host;
        }

        location /finance/ {
            proxy_pass http://finance_service:8000/finance/;
            proxy_set_header Host $host;
        }

        location /admin/ {
            proxy_pass http://admin_service:8000/admin/;
            proxy_set_header Host $host;
        }
    }
}
