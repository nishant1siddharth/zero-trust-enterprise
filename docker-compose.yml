version: '3.8'

x-backend-base: &backend-base
  build:
    context: ./backend
    dockerfile: Dockerfile
  volumes:
    - ./backend:/app
    - ./database:/app/database # Shared SQLite DB for simulation
  environment:
    - ENV=development
    - DATABASE_URL=${DATABASE_URL:-sqlite:///./database/enterprise.db}
    - SECRET_KEY=${SECRET_KEY:-supersecretkey_change_this_for_production}

services:
  # ----------------------------------------------------
  # ZONE 1: PUBLIC GATEWAY
  # ----------------------------------------------------
  api_gateway:
    image: nginx:alpine
    ports:
      - "${BACKEND_PORT:-8000}:8000"
      - "8443:8443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./security:/etc/nginx/ssl:ro
    networks:
      - public_zone
    depends_on:
      - auth_service
      - employee_service
      - hr_service
      - finance_service
      - admin_service

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - VITE_API_URL=http://localhost:${BACKEND_PORT:-8000}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - public_zone

  # ----------------------------------------------------
  # ZONE 2: CORE IDENTITY
  # ----------------------------------------------------
  auth_service:
    <<: *backend-base
    environment:
      - SERVICE_TYPE=AUTH
    networks:
      - public_zone
      - identity_zone

  # ----------------------------------------------------
  # ZONE 3: EMPLOYEE PORTAL
  # ----------------------------------------------------
  employee_service:
    <<: *backend-base
    environment:
      - SERVICE_TYPE=EMPLOYEE
    networks:
      - public_zone
      - employee_zone

  # ----------------------------------------------------
  # ZONE 4: HR
  # ----------------------------------------------------
  hr_service:
    <<: *backend-base
    environment:
      - SERVICE_TYPE=HR
    networks:
      - public_zone
      - hr_zone

  # ----------------------------------------------------
  # ZONE 5: FINANCE
  # ----------------------------------------------------
  finance_service:
    <<: *backend-base
    environment:
      - SERVICE_TYPE=FINANCE
    networks:
      - public_zone
      - finance_zone

  # ----------------------------------------------------
  # ZONE 6: ADMIN
  # ----------------------------------------------------
  admin_service:
    <<: *backend-base
    environment:
      - SERVICE_TYPE=ADMIN
    networks:
      - public_zone
      - admin_zone

networks:
  public_zone:
    driver: bridge
  identity_zone:
    driver: bridge
    internal: true # Cannot access internet directly
  employee_zone:
    driver: bridge
    internal: true
  hr_zone:
    driver: bridge
    internal: true
  finance_zone:
    driver: bridge
    internal: true
  admin_zone:
    driver: bridge
    internal: true
